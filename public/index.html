<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Báo cáo Kinh doanh — Tín Phát</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }

  /* Thuộc tính `hidden` của HTML chạy bằng luật `[hidden]{display:none}` của
     TRÌNH DUYỆT. Mọi luật trong file này (author) đều thắng luật trình duyệt
     trong thứ tự cascade — nên `#manDangNhap{display:flex}` bên dưới đã vô
     hiệu hoá `hidden`, và `manDangNhap.hidden = true` không giấu được gì.
     Hậu quả thật 11/09/2026: đăng nhập THÀNH CÔNG nhưng khung đăng nhập cao
     100vh vẫn che kín màn hình, màn chủ render phía dưới mép màn hình, người
     dùng thấy đúng như "bấm xong không có gì xảy ra" — mất gần một buổi truy
     nhầm sang phía quyền và rules. Dòng này là thứ giữ cho `el.hidden` luôn
     có nghĩa, kể cả khi ai đó đặt `display` cho chính phần tử ấy. */
  [hidden] { display: none !important; }
  body {
    margin: 0; min-height: 100vh; background: #f4f5f7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #1f2430;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 24px 16px 48px; }

  /* ---- Màn đăng nhập ---- */
  #manDangNhap {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 16px;
  }
  .hopDangNhap {
    width: 100%; max-width: 360px; background: #fff; border-radius: 12px;
    padding: 32px 24px; box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  .hopDangNhap h1 { font-size: 18px; margin: 0 0 4px; }
  .hopDangNhap p.phu { color: #6b7280; font-size: 13px; margin: 0 0 20px; }
  .oNhap {
    width: 100%; padding: 10px 12px; margin-bottom: 12px; border: 1px solid #d1d5db;
    border-radius: 8px; font-size: 14px;
  }
  .oNhap:focus { outline: 2px solid #2563eb; outline-offset: -1px; }
  button.chinh {
    width: 100%; padding: 10px 12px; border: none; border-radius: 8px;
    background: #2563eb; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button.chinh:disabled { background: #93c5fd; cursor: default; }
  .canhBao { color: #b91c1c; font-size: 13px; margin: 0 0 12px; min-height: 16px; }

  /* ---- Màn chủ ---- */
  header.thanhTren {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 24px;
  }
  header.thanhTren h1 { font-size: 18px; margin: 0; }
  .aiDangNhap { font-size: 13px; color: #4b5563; }
  .aiDangNhap b { color: #1f2430; }
  /* ---- Nút PHẲNG: không nền, không viền (chủ dự án chốt 13/09/2026) ----
     Một trang chỉ có vài chục nút mà nút nào cũng đóng khung thì cái khung
     thành nhiễu nền, không còn là dấu hiệu "bấm được". Bỏ nền và viền đi thì
     thứ duy nhất còn nổi lên là NỘI DUNG — và trạng thái đang chọn (tab xanh)
     lại đọc được ngay từ xa. Viền chỉ quay lại lúc rê chuột: đó là lúc câu
     hỏi "cái này bấm được không" thật sự được đặt ra. */
  button.dangXuat {
    border: 1px solid transparent; background: none; border-radius: 8px;
    padding: 6px 10px; font-size: 13px; cursor: pointer; margin-left: 8px;
    color: #3d4a63; font-weight: 600; transition: background .12s, color .12s;
  }
  button.dangXuat:hover { background: rgba(29,91,234,.10); color: #1d5bea; }

  #hopLoi { color: #b91c1c; font-size: 13px; }

  /* Trang chủ = màn báo cáo: bảng đơn hàng 16 cột cần rộng hơn 720px của
     `.wrap`. Chỉ nới BỀ NGANG, không đụng `display` — `hidden` phải giữ
     nguyên tác dụng (xem khối [hidden] ở đầu file). */
  #manChu { max-width: none; }

  /* ---- Tab + Dashboard ---- */
  .tabDonVi { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  /* Một `<p>` RỖNG vẫn chiếm trọn lề trên + lề dưới của nó — ba thẻ như thế
     (`#loiDonHang`, `#bangConNo`, `#skLoi`) đứng giữa hàng tab và bảng, cộng
     lại gần 70px khoảng trắng ở trạng thái BÌNH THƯỜNG (không lỗi, không nợ
     mã). Chủ dự án khoanh đỏ đúng chỗ ấy 12/09/2026. Giấu khi rỗng thay vì
     bỏ thẻ đi: chúng phải còn sẵn trong DOM để mã vá chữ vào tại chỗ. */
  .canhBao:empty, .bangConNo:empty, .chuGiaiSk:empty { display: none; }
  /* Năm và tháng nằm CÙNG một hàng, cách nhau một khoảng trống (chủ dự án
     chốt 11/09/2026). Hai nhóm là hai flex riêng để mỗi nhóm tự xuống dòng
     mà không trộn lẫn nút năm với nút tháng. */
  .hangThoiGian { gap: 0; align-items: center; }
  .hangThoiGian .nhomTab { display: flex; gap: 6px; flex-wrap: wrap; }
  .hangThoiGian .nhomTab + .nhomTab { margin-left: 28px; }
  /* Nếp `.btn-mini` của Tracking: viền mảnh, bo 10px, rê chuột chuyển xanh.
     Hai app đứng cạnh nhau nên nút phải đọc ra cùng một thứ. */
  .tabNut {
    border: 1px solid transparent; background: none; border-radius: 10px;
    padding: 6px 14px; font-size: 13px; font-weight: 600; cursor: pointer;
    color: #3d4a63; transition: background .12s, color .12s;
  }
  .tabNut:hover:not(:disabled):not(.tabDang) { background: rgba(29,91,234,.10); color: #1d5bea; }
  .tabNut.tabDang { background: #1d5bea; border-color: #1d5bea; color: #fff; font-weight: 600; }
  .tabNut:disabled { color: #d1d5db; cursor: default; background: #fafafa; }
  .tabNut.tabNho { padding: 4px 10px; font-size: 12px; }
  .dangTai { color: #6b7280; font-size: 13px; }
  .tieuDeSk { margin: 0 0 8px; font-size: 13px; font-weight: 600; color: #1f2430; }
  .tieuDeSk .donViCua { color: #9ca3af; font-weight: 400; }
  .chuGiaiSk { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 10px; font-size: 12px; color: #4b5563; }
  .chuGiaiSk span { display: flex; align-items: center; gap: 6px; }
  .chuGiaiSk i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; }
  .chuGiaiSk .donViSk { color: #9ca3af; margin-left: auto; }

  /* ---- Hai cột: biểu đồ lớn bên trái, lưới nhỏ bên phải (P6) ----
     Chủ dự án chốt 12/09/2026. Tỉ lệ 3:2 — biểu đồ lớn cần bề ngang để 31
     ngày không dồn vào nhau, còn lưới nhỏ xếp được 2 ô mỗi hàng ở phần còn
     lại. Dưới 1000px thì xếp dọc: ép hai cột vào màn hẹp là cả hai cùng
     không đọc được. */
  /* Dải điều khiển chia ĐÚNG HAI CỘT như khối biểu đồ bên dưới (chủ dự án
     chốt 12/09/2026): mỗi tiêu đề phải đứng trên đúng cụm mà nó gọi tên.
     Bản trước là một flex duy nhất nên tiêu đề của biểu đồ TRÁI bị đẩy tới
     mép phải của cả dải — tức là nằm ngay trên cụm ô nhỏ, trông như tiêu đề
     của cụm ấy. Hai cột cùng `1fr 1fr` và cùng khe hở 20px với
     `.haiCotBieuDo` nên hai dải xếp thẳng hàng nhau. */
  .daiDieuKhien { display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
    align-items: center; margin-bottom: 6px; }
  @media (max-width: 1000px) { .daiDieuKhien { grid-template-columns: 1fr; } }
  .daiDieuKhien .cumTrai { display: flex; gap: 20px; flex-wrap: wrap; align-items: center; }
  /* Tiêu đề cụm ô nhỏ dồn về mép phải của CỘT PHẢI — cùng lối với tiêu đề
     biểu đồ trái, nên hai tiêu đề cân nhau ở hai đầu dải. */
  .daiDieuKhien .cumPhai { display: flex; justify-content: flex-end; align-items: center;
    min-width: 0; }
  .daiDieuKhien .tabDonVi { margin-bottom: 0; }
  /* Chú giải dồn sang mép PHẢI của cùng hàng ấy — nửa phải của hàng nút vốn
     bỏ không, còn chú giải thì đang chiếm trọn một dòng riêng. */
  .daiDieuKhien .chuGiaiSk { margin-top: 0; }
  /* Tiêu đề biểu đồ dồn sang mép PHẢI của cụm trái, chú giải bám ngay sau. */
  .daiDieuKhien .tieuDeSk { margin: 0 0 0 auto; font-weight: 500; color: #4b5563;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .daiDieuKhien .cumPhai .tieuDeSk { margin: 0; }
  /* `align-items: stretch` (mặc định của grid) là điều kiện để hai cột CÙNG
     chiều cao — chiều cao ấy do `canhCaoKhoi()` đo và gán, xem suc-khoe.js.
     Bản trước dùng `align-items: start` nên mỗi cột tự cao theo nội dung, và
     lưới 10 ô bên phải cao gần gấp đôi biểu đồ bên trái. */
  /* Hai cột BẰNG NHAU (chủ dự án chốt 12/09/2026, đổi từ 3fr:2fr). Cột phải
     hẹp làm các ô nhỏ co cụm lại và phải xếp nhiều hàng; chia đôi thì mỗi ô
     rộng ra và cụm chia được thành lưới vuông vắn. */
  .haiCotBieuDo { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 1000px) { .haiCotBieuDo { grid-template-columns: 1fr; } }
  /* Cả hai cột là flex dọc: tiêu đề/chú giải cao bao nhiêu tuỳ chữ, phần
     CÒN LẠI (`flex: 1`) mới là khung vẽ. Nhờ vậy JS không phải cộng tay
     chiều cao của tiêu đề — thứ đổi theo cỡ chữ của người dùng. */
  .cotTrai, .cotPhai { display: flex; flex-direction: column; min-height: 0; }
  .cotPhai { border-left: 1px solid #e5e7eb; padding-left: 18px; }
  @media (max-width: 1000px) {
    .cotPhai { border-left: none; border-top: 1px solid #e5e7eb; padding-left: 0; padding-top: 14px; }
  }
  /* Khung vẽ của biểu đồ lớn — `min-height: 0` bắt buộc, không có nó thì
     một flex item không co xuống dưới kích thước nội dung và cả cột phình
     ra khỏi chiều cao đã ép. */
  .khoiBieuDo { flex: 1 1 0; min-height: 0; }
  .khoiBieuDo svg { display: block; width: 100%; height: 100%; }

  /* ---- Lưới nhỏ — xu hướng theo Line ---- */
  /* `overflow-y: auto` là VAN AN TOÀN: màn quá thấp hay quá nhiều line thì
     riêng cụm này cuộn, thay vì đẩy cả trang dài ra — chủ dự án chốt mở
     trang là thấy hết, không phải kéo thanh trượt. */
  /* `grid-auto-rows: 1fr` + `align-content: stretch`: các HÀNG chia đều
     chiều cao cột, nên cụm lấp đầy thay vì xếp sát mép trên rồi bỏ trống
     phần dưới (chủ dự án khoanh đỏ 12/09/2026). Chiều cao hệ toạ độ của
     từng ô do `canhCaoKhoi()` tính theo đúng số hàng ấy. */
  /* `grid-template-columns` do JS gán (`veKhoiLuoiNho` chọn số cột theo bề
     rộng thật và số ô, để lưới chia thành ít hàng mà ô không quá hẹp). */
  /* `margin-top: 0` từ 12/09/2026: tiêu đề cụm đã dời lên dải điều khiển,
     nên lưới bắt đầu ngay mép trên cột — chỗ tiêu đề bỏ lại thuộc về các ô,
     đúng ý "dời rồi thì lấp vào khoảng trống ấy". */
  .luoiXuHuong { flex: 1 1 0; min-height: 0; overflow-y: auto;
    display: grid; grid-auto-rows: 1fr; gap: 8px; margin-top: 0; align-content: stretch; }
  .oMini { background: #fafafa; border: 1px solid #f0efec; border-radius: 8px; padding: 6px;
    display: flex; flex-direction: column; min-height: 0; }
  .oMini svg { flex: 1 1 0; min-height: 0; width: 100%; height: 100%; display: block; }
  .tenMini { margin: 0 0 2px; font-size: 11px; line-height: 1.3; font-weight: 600; color: #4b5563;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .oMiniRong { display: flex; flex-direction: column; justify-content: center; min-height: 56px; }
  .miniRong { margin: 0; font-size: 11px; color: #9ca3af; }
  /* Ô chữ hiện khi rê chuột trong một ô nhỏ (chủ dự án chốt 12/09/2026,
     thay cho nhãn số in sẵn ở cuối mỗi đường). `pointer-events: none` bắt
     buộc: ô chữ bám theo con trỏ, nếu nó ăn được chuột thì chính nó che mất
     vùng đang rê và biểu đồ nhấp nháy. */
  .chuBay { position: fixed; z-index: 40; pointer-events: none; display: none;
    background: #1f2430; color: #fff; border-radius: 6px; padding: 5px 9px;
    font-size: 12px; line-height: 1.4; white-space: nowrap;
    box-shadow: 0 4px 14px rgba(15, 23, 42, .22); }
  .chuBay b { font-weight: 600; }
  .chuBay span { display: block; color: #cbd5e1; font-size: 11px; }

  /* ---- Màn nhập sổ + màn đơn hàng (P3) ---- */
  .hangChon { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .nutNho {
    border: 1px solid transparent; background: none; border-radius: 8px;
    padding: 6px 12px; font-size: 13px; font-weight: 600; cursor: pointer;
    color: #3d4a63; transition: background .12s, color .12s;
  }
  .nutNho:hover:not(:disabled) { background: rgba(29,91,234,.10); color: #1d5bea; }
  .nutNho:disabled { color: #9ca3af; cursor: default; }
  .khoiKq { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 16px; margin-bottom: 12px; }
  .khoiKq h3 { margin: 0 0 10px; font-size: 15px; }
  .khoiXong { border-left: 4px solid #16a34a; }
  .khoiTuChoi { border-left: 4px solid #b91c1c; }
  .soLieu { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; margin: 0 0 10px; font-size: 13px; }
  .soLieu dt { color: #6b7280; }
  .soLieu dd { margin: 0; font-weight: 600; }
  .tomTatDoi, .tomTatDon { font-size: 13px; margin: 8px 0; }
  .canhBaoDam { color: #b45309; font-size: 13px; font-weight: 600; margin: 8px 0; }
  .dsCanhBao { margin: 8px 0; padding-left: 20px; font-size: 13px; }
  .dsCanhBao li { margin-bottom: 4px; }
  .viDu { color: #6b7280; font-size: 12px; }
  .khoiDoi { margin-top: 8px; font-size: 13px; }
  .khoiDoi summary { cursor: pointer; color: #2563eb; }
  .motBanLuu { display: flex; justify-content: space-between; align-items: center; gap: 12px;
    font-size: 13px; padding: 6px 0; border-top: 1px solid #f3f4f6; }
  .bangNho { border-collapse: collapse; width: 100%; font-size: 12px; margin-top: 8px; }
  .bangNho th, .bangNho td { border: 1px solid #e5e7eb; padding: 4px 8px; text-align: left; }
  .bangNho th { background: #f9fafb; }

  /* ---- Bảng [Tổng hợp] 15 cột (P6, chủ dự án chốt 12/09/2026) ----
     Số canh PHẢI: mười một trong mười lăm cột là số, và một cột số canh trái
     thì mắt không so được độ lớn giữa các hàng — đúng việc người ta mở bảng
     này ra để làm. `.bangNho` chung vẫn canh trái vì những bảng nhỏ khác
     (bản lưu, đối chiếu) phần lớn là chữ. */
  .bangNho .oSo { text-align: right; font-variant-numeric: tabular-nums; }
  /* 15 cột không lọt bề ngang màn hình hẹp. Cho cuộn NGANG ở khung bọc chứ
     không ép chữ xuống dòng: một bảng số mà mỗi ô cao hai dòng là mất nhịp
     đọc theo hàng. Chỉ `overflow-x` — khung này không có trần chiều cao nên
     không kéo theo thanh cuộn dọc như `.bocBang` của bảng đơn. */
  .bocBangNho { overflow-x: auto; }
  .bangTongHop { white-space: nowrap; min-width: 100%; width: auto; }
  /* Cột "Doanh số quy đổi" — chủ dự án yêu cầu highlight. Tô NỀN chứ không
     đổi màu chữ: màu chữ ở bảng này đã mang nghĩa khác (tăng/giảm ở cột
     Vs. Tháng trước), chồng thêm một nghĩa nữa lên cùng một tín hiệu là chỗ
     để người đọc hiểu nhầm. */
  .bangTongHop th.oQuyDoi { background: #dbeafe; }
  .bangTongHop td.oQuyDoi { background: #eff6ff; font-weight: 600; }
  .bangTongHop td.vsTang { color: #047857; }
  .bangTongHop td.vsGiam { color: #b91c1c; }

  /* ---- Vượt KPI: ba mức, ba màu (chủ dự án chốt 12/09/2026) ----
     Tô ở ô "Đạt" chứ không tô cả hàng — cột Doanh số quy đổi đã có nền riêng,
     tô cả hàng là đè lên nó và xoá mất tín hiệu cũ. Ba mốc cũng đúng ba mốc
     đổi bậc thưởng, nên màu ở đây đọc được thành "line vừa lên một bậc".
     Đậm dần chứ không đổi tông: ba màu rời rạc thì phải học bảng màu mới
     đọc được thứ tự, còn đậm dần thì nhìn là biết cái nào hơn. */
  .bangTongHop td.dat100 { background: #dcfce7; color: #14532d; font-weight: 600; }
  .bangTongHop td.dat110 { background: #86efac; color: #14532d; font-weight: 600; }
  .bangTongHop td.dat120 { background: #22c55e; color: #052e16; font-weight: 700; }

  /* Ô nhập ngày công nằm TRONG ô bảng, không phải một cột riêng — cùng lối ô
     tick gia dụng của P5 nằm trong ô Mã sản phẩm. */
  .bangTongHop td.oCong { padding: 2px 4px; }
  /* ---- Ô NHẬP PHẲNG (chủ dự án chốt 13/09/2026) ----
     Cùng lối với nút: nghỉ thì hoà vào nền, rê chuột mới hiện viền, gõ thì
     hiện rõ hẳn. Một ô trắng đóng khung giữa một bảng trắng không nói thêm
     được gì — nhưng bỏ SẠCH mọi dấu hiệu thì cũng không ai biết chỗ nào gõ
     được, nên viền không biến mất mà chỉ trong suốt: nó quay lại đúng lúc
     con trỏ tới, tức đúng lúc câu hỏi "gõ được không" được đặt ra. */
  .bangTongHop input.oNgayCong {
    width: 58px; padding: 2px 4px; font-size: 12px; text-align: right;
    border: 1px solid transparent; border-radius: 6px; background: transparent;
    color: inherit; transition: border-color .12s, background .12s;
  }
  .bangTongHop input.oNgayCong:hover:not(:disabled) { border-color: #cbd5e1; }
  .bangTongHop input.oNgayCong:focus {
    border-color: #1d5bea; background: #fff; outline: none;
  }
  /* Đang gửi: mờ cả bảng và chặn bấm tiếp, để hai lượt ghi không chồng nhau
     lên cùng một ô. Cùng lối `.daiKpi.dangGui`. */
  .bangTongHop.dangGui { opacity: .55; pointer-events: none; }
  /* Ghi chú là cột CHỮ duy nhất của bảng — cho nó xuống dòng được, còn lại
     giữ `nowrap` như cũ. */
  .bangTongHop td.oGhiChuLuong { white-space: normal; color: #4b5563; }

  /* ---- Ba chỉnh bề rộng, chủ dự án chốt 12/09/2026 ----
     Cột Line RỘNG ra: nó là thứ người đọc quét mắt xuống để tìm hàng mình
     cần, mà tên line dài nhất ("Quyết chiến") đang bị bóp sát bằng đúng
     chiều dài chữ. */
  .bangTongHop th.oLine, .bangTongHop td:first-child { min-width: 130px; }
  /* Sáu cột từ "Thưởng" trở đi là THÔNG SỐ PHỤ — chữ nhỏ hơn, đệm hẹp hơn,
     màu nhạt hơn, để mắt bám vào khối doanh số/lợi nhuận/quy đổi trước. Thu
     nhỏ chứ không giấu: chúng vẫn phải đọc và đối chiếu được. */
  .bangTongHop .oPhu { font-size: 11px; padding-left: 5px; padding-right: 5px; }
  .bangTongHop td.oPhu { color: #6b7280; }
  .bangTongHop th.oPhu { color: #6b7280; font-weight: 500; }
  /* Tổng lương là con số người ta thật sự tìm trong cả nhóm phụ — cho nó lại
     màu chữ thường để nó không chìm cùng năm cột kia. */
  .bangTongHop td.oPhu:nth-last-child(2) { color: #111827; font-weight: 600; }

  /* Ghim đầu cột (chủ dự án chốt 12/09/2026): `overflow-x: auto` một mình
     đã ĐỦ để trình duyệt tự áp `overflow-y: auto` — luật phụ thuộc của CSS
     Overflow, hai trục không được lệch pha "một cái auto, một cái visible".
     Nếu khung này không có chiều cao trần, `<th> { position: sticky }` bên
     dưới sẽ dính so với CHÍNH khung này chứ không so với trang — mà khung
     cao theo nội dung nên không có gì để cuộn bên trong, và khi người dùng
     cuộn cả TRANG thì đầu cột trôi tuột theo (đo bằng Playwright: top đổi
     416px → −483px sau một lượt cuộn, tức sticky vô tác dụng).

     `max-height` là giá trị SÀN — `dieuChinhCaoBang()` bên don-hang.js tính
     lại theo phần còn lại của màn hình ngay sau khi vẽ bảng. Giữ giá trị
     CSS ở đây chỉ để khung không vô hạn chiều cao trong một tích tắc trước
     khi JS chạy (không có nó thì tài liệu tĩnh — JS tắt, hay lỗi giữa
     chừng — quay lại đúng lỗi cũ). */
  .bocBang { overflow-x: auto; overflow-y: auto; max-height: 70vh; }
  /* `table-layout: fixed` + <colgroup> (RONG_COT bên don-hang.js) — bề rộng
     cột CHỐT CỐ ĐỊNH, chủ dự án chốt 12/09/2026. Trước đây bề rộng do nội
     dung quyết định, nên đúng lúc P4 điền chữ vào những ô đang là "—" thì cả
     bảng nống ra và dịch chỗ. Gán mã là việc làm liên tục trên cùng một màn
     hình; mỗi lần gán mà bố cục giật một cái là không dùng được.

     Đi kèm bắt buộc: `overflow: hidden` trên ô. Với bố cục cố định, nội dung
     rộng hơn cột KHÔNG tự co — nó tràn đè sang ô bên cạnh, và đó cũng là
     "biến dạng", chỉ khác kiểu. */
  .bangDon { border-collapse: collapse; font-size: 12px; white-space: nowrap;
    table-layout: fixed; }
  .bangDon th, .bangDon td { overflow: hidden; text-overflow: ellipsis; }
  .bangDon th, .bangDon td { border: 1px solid #e5e7eb; padding: 4px 8px; text-align: left; }
  .bangDon th { background: #f9fafb; position: sticky; top: 0; z-index: 1; }
  /* Hàng TỔNG của cả bảng, ngay dưới hàng tiêu đề (chủ dự án chốt
     13/09/2026). Nền đậm hơn một hàng thường để không lẫn với dữ liệu chi
     tiết, nhạt hơn hàng tiêu đề để không tranh với tên cột. KHÔNG sticky —
     nó cuộn theo bảng như mọi hàng khác; chỉ hàng tiêu đề mới cần đứng yên. */
  .bangDon tr.hangTongBang > td {
    background: #eef2ff; font-weight: 700; border-top: 2px solid #c7d2fe;
  }
  .bangDon .oSo { text-align: right; }
  .bangDon .oTen { white-space: normal; max-width: 260px; }

  /* Bốn cột thông tin khách + IMEI: thu hẹp và CẮT bớt, không xuống dòng
     (chủ dự án chốt 11/09/2026). Một địa chỉ dài từng đẩy chiều cao dòng lên
     gấp ba và làm mất nhịp đọc theo hàng ngang của cả bảng.

     `max-width` đặt trên <td> bị bố cục bảng tự động bỏ qua, nên phải bọc nội
     dung trong một <span> khối — đó là lý do `oHep()` bên don-hang.js dựng
     thêm một thẻ con thay vì gán thẳng textContent. Chữ đầy đủ vẫn còn ở
     `title`, rê chuột là đọc được. */
  .bangDon .oHep > span {
    display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .bangDon .oKhach > span { max-width: 130px; }
  .bangDon .oDienThoai > span { max-width: 92px; }
  .bangDon .oDiaChi > span { max-width: 150px; }
  .bangDon .oImei > span { max-width: 110px; }

  /* Hai cột icon cuối bảng. Ở lượt này nút còn `disabled` — Sửa/Xoá là việc
     của P3 lượt 2; hiện ra mờ để thấy trước chỗ, bấm vào không làm gì. */
  /* ---- Gán mã sản phẩm (P4) ----
     Dòng ĐÃ phân loại hiện y như trước (chủ dự án chốt): không tô, không
     thêm chữ. Chỉ dòng CHƯA phân loại mới khác đi — đủ để lướt mắt là thấy
     phần còn nợ, không đủ để làm ồn cả bảng. */
  .bangDon td.oMa { cursor: pointer; }
  .bangDon td.maChuaCo {
    color: #b45309; background: #fffbeb;
    text-decoration: underline dotted #d97706; text-underline-offset: 2px;
  }
  .bangDon td.maChuaCo:hover, .bangDon td.maBoQua:hover { background: #fef3c7; }
  .bangDon td.maBoQua { color: #9ca3af; font-style: italic; }

  /* Mã bảng giá hiện thay cho câu tên kế toán, ở dòng ĐÃ khớp mã (chủ dự án
     chốt 12/09/2026). Chữ đều nét (`tabular-nums` + mono) để một cột mã xếp
     thẳng hàng nhau — đó là cái lợi thật khi quét mắt xuống hàng trăm dòng,
     và là cách cùng một mã đọc được y như bên Tracking. */
  .bangDon td.oMa span.maNgan {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 12px; letter-spacing: .01em;
  }

  .bangConNo { font-size: 13px; color: #92400e; margin: 6px 0; }
  /* ---- Đầu cột: nhãn + nút lọc trên MỘT hàng ngang ----
     Chép nếp `.btn-mini` của Tracking (`public/index.html` repo đó): viền
     mảnh, bo 10px, chữ 12px/600, rê chuột thì viền và chữ chuyển xanh. Cùng
     một người dùng mở hai app cạnh nhau — hai thứ nút khác nhau cho cùng một
     việc là bắt họ học hai lần.

     `display: flex` đặt trên <div> BÊN TRONG <th>, không đặt lên chính <th>:
     một ô bảng chuyển sang flex là rơi khỏi bố cục bảng, và cả <colgroup>
     lẫn `table-layout: fixed` hết tác dụng — mất đúng thứ P4 phải sửa. */
  .bangDon th > .oDauCot { display: flex; align-items: center; gap: 4px; min-width: 0; }
  .bangDon th .tenCot { flex: 1 1 auto; min-width: 0;
                        overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Nút giữ nguyên kích thước dù cột hẹp cỡ nào — nó KHÔNG được co, và cũng
     không được đẩy nhãn xuống dòng thứ hai (đúng cái "biến dạng cột" của bản
     `float: right` trước). */
  .nutLoc { flex: 0 0 auto; border: 0; background: none; color: #9ca3af;
            border-radius: 5px; padding: 0 3px; height: 18px; line-height: 0;
            cursor: pointer; transition: background .12s, color .12s; }
  .nutLoc svg { width: 12px; height: 12px; display: block; }
  .nutLoc:hover { background: rgba(29,91,234,.12); color: #1d5bea; }
  .nutLoc.locDang { background: #1d5bea; color: #fff; }
  /* TÊN CỘT ĐỎ = cột này còn ô thiếu. Thay hẳn hai băng chữ dưới bảng. */
  .bangDon th.cotCanhBao .tenCot { color: #c4361f; font-weight: 700; }
  .bangLoc { font-size: 13px; color: #56637f; margin: 6px 0; }
  /* ---- Bonus lợi nhuận theo đơn (chốt 12/09/2026) ----
     Ô nằm trên hàng TỔNG của đơn, dưới đúng cột Lợi nhuận. `position:
     relative` để hộp nhập bung ra được mà không kéo giãn hàng tổng — hàng ấy
     nằm giữa bảng, giãn nó ra là mọi dòng bên dưới nhảy chỗ ngay dưới con
     trỏ người đang bấm. */
  /* Nút bên TRÁI, số bên PHẢI (chủ dự án chốt 13/09/2026). Đặt nút sau số
     thì bề rộng nút bị cộng vào phần bên phải và con số bonus lùi trái đúng
     bằng một cái nút, không còn thẳng hàng với mọi con số khác của cột.
     `justify-content: space-between` đẩy nút sát mép trái, số sát mép phải —
     mép phải ấy là cùng một đường với mọi hàng khác.
     `align-items: center` là vế thứ hai: nút cao 18px cạnh một dòng chữ 13px,
     không canh giữa thì nó thò lên và làm hàng trông cao thêm. */
  .bangDon td.oBonus { position: relative; white-space: nowrap;
                       display: flex; align-items: center;
                       justify-content: space-between; gap: 6px; }
  .soBonus { color: #0f9d58; font-weight: 600; margin-left: auto; }
  .nutBonus { border: 0; background: none; color: #9ca3af; border-radius: 5px;
              padding: 0 3px; height: 18px; line-height: 0; flex: 0 0 auto;
              cursor: pointer; transition: background .12s, color .12s; }
  .nutBonus svg { width: 13px; height: 13px; display: block; }
  .nutBonus:hover { background: rgba(15,157,88,.14); color: #0f9d58; }
  .bangDon td.oLyDoBonus { color: #56637f; font-style: italic; }
  /* ---- Băng ngày = trình thả xuống (chủ dự án chốt 13/09/2026) ----
     Đóng sẵn: một tháng có ~500 dòng, mở hết ra thì phải cuộn mới biết tháng
     có mấy ngày. */
  .hangNgay td { cursor: pointer; user-select: none; }
  .hangNgay:hover td { background: #e0e7ff; }
  /* Ngày còn đơn chưa đủ giá vốn: tô CẢ BĂNG. Đóng lại rồi thì một dấu "*"
     lọt trong dòng chữ dài không đủ để mắt bắt được ngày nào còn việc; cả
     băng đổi màu thì lướt dọc một tháng là thấy ngay. */
  .hangNgay.ngayThieu td { background: #fef3c7; }
  .hangNgay.ngayThieu:hover td { background: #fde68a; }
  .muiTenNgay { width: 12px; height: 12px; vertical-align: -1px; margin-right: 6px;
                color: #6b7280; transform: rotate(90deg); transition: transform .12s; }
  .hangNgay.dongLai .muiTenNgay { transform: rotate(0deg); }
  .chuNgay { font-weight: 700; }
  /* Lưới CỐ ĐỊNH bề rộng cho bốn con số của băng ngày (chủ dự án chốt
     13/09/2026: "cân lại cho thẳng theo cột thay vì thụt ra thụt vào").
     `display: inline-grid` với `grid-template-columns` cố định — không dùng
     flex + gap: flex chỉ đảm bảo KHOẢNG CÁCH đều, không đảm bảo MỖI Ô bắt
     đầu ở cùng một vị trí khi nội dung dài ngắn khác nhau giữa các ngày; grid
     với cột cố định thì có. `tabular-nums` giữ mọi chữ số cùng bề rộng, nên
     hai số cùng bậc (hàng nghìn/hàng chục nghìn) không bị lệch bởi phông chữ
     tỉ lệ. Bốn cột đủ rộng cho dòng dài nhất đã gặp (12 đơn, "159.950", "LN
     9.950 *", "QĐ 132.667") mà không phải đổi theo dữ liệu từng tháng — cố
     định là cả điểm của việc canh thẳng. */
  .soNgay { display: inline-grid; grid-template-columns: 64px 92px 118px 118px;
            column-gap: 16px; margin-left: 14px; font-variant-numeric: tabular-nums; }
  .soNgay .ngayO { text-align: right; font-weight: 400; color: #3d4a63; }
  /* Ô nhập ngay tại chỗ, thay hộp nổi của bản đầu (chủ dự án chốt
     13/09/2026: hộp che mất chính cái đơn đang cộng cho). */
  .oSuaLyDo { border: 1px solid #d1d5db; border-radius: 6px; padding: 2px 4px;
              font-size: 12px; font-family: inherit; max-width: 100%; }
  .bangDon td.thieuLyDo .oSuaLyDo { border-color: #c4361f; }
  .oKhac { margin-top: 3px; width: 100%; }
  .bangDon tr.dangSuaBonus > td { background: #fffbeb; }
  /* Kỳ ngoài phạm vi dữ liệu giá: một câu GIẢI THÍCH, không phải cảnh báo —
     nên màu xám như `.viDu`, không vàng như băng còn-nợ. Người dùng không có
     việc gì phải làm với nó. */
  .ghiChuPhamVi { font-size: 13px; color: #6b7280; margin: 6px 0; }
  /* Ô Giá nhập chưa có số: mờ đi một chút để phân biệt với ô có số, và lý do
     nằm ở `title`. Không tô vàng như ô chưa gán mã — phần lớn những ô này
     người dùng không tự làm gì được. */
  .bangDon td.oChuaGia { color: #9ca3af; }
  /* Ô chưa rõ thông tin (nơi nhập chưa tra được): chữ ĐỎ. Chủ dự án chốt
     12/09/2026 — khác ô Giá nhập chỉ mờ đi, vì nơi nhập trống là dấu hiệu
     dòng đó chưa nối được vào hệ giá, đáng soi hơn. */
  .bangDon td.oChuaRo { color: #dc2626; }

  /* Dòng 0 đồng — quà tặng kèm cho khách. Bôi đỏ cả dòng để lướt mắt là
     thấy: chúng không có doanh thu nhưng VẪN có giá vốn, nên chúng kéo lợi
     nhuận xuống đúng như một dòng chiết khấu. Nền nhạt thôi, vì một tháng có
     thể có vài chục dòng như vậy và tô đậm cả dòng thì bảng thành đỏ rực.
     Chứng từ BTL cũng 0 đồng nhưng KHÔNG mang lớp này (xem `khop-ma.mjs`). */
  /* ---- Sửa tay một dòng (P5) ----
     XANH = dòng đang mang một quyết định của người. Chủ dự án chốt: dòng đã
     sửa tay mà sống qua lần nhập lại thì hiện xanh — nó là dấu hiệu "con số
     này không phải máy tính ra", và nó phải thấy được mà không cần rê chuột. */
  .bangDon tr.hangSuaTay > td { background: #f0fdf4; }
  .bangDon tr.hangSuaTay > td:first-child { box-shadow: inset 3px 0 0 #16a34a; }
  /* Dòng đang mở ô nhập — viền xanh dương để phân biệt hẳn với "đã sửa". */
  .bangDon tr.hangDangSua > td { background: #eff6ff; }
  .bangDon tr.hangDangGui > td { opacity: .55; }
  .oSuaGia, .oSuaNoi {
    width: 100%; box-sizing: border-box; font: inherit; padding: 1px 4px;
    border: 1px solid #1d5bea; border-radius: 6px; background: #fff; outline: none;
  }
  .oSuaGia { text-align: right; }

  /* DÒNG LỖ — chiết khấu kéo lợi nhuận xuống âm, hoặc bán dưới giá vốn (chủ
     dự án chốt 12/09/2026). Cùng sắc đỏ với dòng 0 đồng nhưng KHÔNG cùng một
     lớp: hai thứ là hai việc khác nhau, và gộp lớp thì sau này sửa màu của
     cái này là lỡ tay đổi luôn cái kia. Vạch trái đỏ để phân biệt với dòng
     0 đồng khi hai loại nằm cạnh nhau trong cùng một đơn. */
  .bangDon tr.hangLo > td { background: #fef2f2; color: #b91c1c; }
  .bangDon tr.hangLo > td:first-child { box-shadow: inset 3px 0 0 #dc2626; }

  .bangDon tr.hang0d > td { background: #fef2f2; color: #b91c1c; }
  .bangDon tr.hang0d > td.oChuaRo { color: #dc2626; font-weight: 600; }

  /* BÁN TRẢ LẠI (chứng từ BTL) — cả dòng gốc lẫn dòng trả lại. Xám trung
     tính, KHÔNG dùng lại nền đỏ của dòng 0 đồng: một cặp BTL đã triệt tiêu
     nhau cũng hiện "0" ở mọi cột tiền, nên nếu hai thứ cùng màu thì người
     đọc sẽ hiểu nhầm nó là quà tặng và đi tìm một khoản giá vốn không có.
     Vạch trái để lướt mắt bắt được cặp dòng đi với nhau. */
  .bangDon tr.hangBTL > td { background: #f1f5f9; color: #334155; }
  .bangDon tr.hangBTL > td:first-child { box-shadow: inset 3px 0 0 #64748b; }
  .bangDon tr.hangBTL > td.oChuaRo { color: #dc2626; font-weight: 600; }
  .bangConNo.xong { color: #15803d; }
  .bangNguonHong {
    font-size: 13px; color: #991b1b; background: #fef2f2;
    border: 1px solid #fecaca; border-radius: 6px; padding: 8px 10px; margin: 6px 0;
  }

  /* ---- Dải setup KPI / hệ số quy đổi (P5) ----
     Đứng NGAY TRÊN bảng đơn của từng tab line. Chủ dự án chốt 12/09/2026:
     "tạo cho tôi 1 trình setup ở mỗi tab nhân viên". Khung nhạt, không viền
     đậm: nó là chỗ đặt mục tiêu, không phải một cảnh báo. */
  .daiKpi {

  /* Ô đang mang một con số RIÊNG của kỳ này (không phải mặc định): viền xanh
     dương để phân biệt, cùng sắc với ô đang sửa của bảng đơn. Không có dấu
     này thì người sửa không biết mình vừa đổi cho MỘT tháng hay cho MỌI
     tháng — đúng chỗ bộ "mặc định + ghi đè" dễ gây hiểu nhầm nhất. */
  /* Viền xanh của ô "riêng tháng này" là DẤU HIỆU NGHĨA, không phải trang
     trí — nó phân biệt "đổi cho MỘT tháng" với "đổi cho MỌI tháng". Nó ở lại
     kể cả khi ô nghỉ, khác mọi ô phẳng khác. */
  .daiKpi .oKpi.rieng { border-color: #1d5bea; background: rgba(29,91,234,.07); }

  }

  /* Nút đẩy khoá khi chưa dán link — nói bằng màu chứ không chỉ bằng `title`,
     vì một nút trông bấm được mà bấm không ăn là lời hứa hỏng. */
  .daiSheet .nutNhoKpi:disabled { color: #9aa3b2; cursor: not-allowed; }
  .daiKpi.dangGui { opacity: .55; }
  /* Quản lí ĐỌC được dải này (rules của bc/quyetdinh mở cho cả hai vai) nhưng
     không đặt được — Gateway chặn. Khoá ô sẵn và nói lý do ở `title` thay vì
     để họ gõ rồi ăn 403: một ô gõ được mà lưu không được là lời hứa hỏng. */
  .daiKpi .oKpi:disabled { background: none; color: #6b7280; cursor: not-allowed; }

  /* ---- Dải đẩy sang Google Sheet (13/09/2026) ----
     Một hàng RIÊNG dưới dải KPI, không chen vào cùng hàng: dải KPI là mấy ô
     số ngắn đọc lướt được, còn ô này là một link dài. Nhét chung thì hàng

     Chỉ Quản trị thấy dải này (don-hang.js), nên không có trạng thái khoá. */
  .daiSheet {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
    padding: 0 0 6px; margin: -4px 0 8px; font-size: 13px;
  }
  .daiSheet label { display: flex; align-items: center; gap: 6px; flex: 1 1 420px; }
  .daiSheet .nhanSheet { color: #6b7280; white-space: nowrap; }
  .daiSheet .oSheet {

  /* Lỗi lượt đẩy gần nhất: đỏ thật, không phải vàng "còn nợ" — số trên Sheet

  .nutNapKpi:hover:enabled { background: #fef3c7; }
  .nutNapKpi:disabled { opacity: .6; cursor: progress; }

  /* Ô tick "gia dụng" — nằm TRONG ô Mã sản phẩm, chỉ ở line có hệ số gia
     dụng. Chủ dự án chốt 12/09/2026: "ngay trong ô mã sản phẩm, không cần
     ghi tiêu đề cột quá rõ, chỉ cần ô tick là tôi tự hiểu". Nhờ vậy bảng vẫn
     đúng 19 cột — không sinh một cột chỉ có mặt ở một tab. */
  /* `accent-color` là cách DUY NHẤT đổi màu ô tick mà không phải vẽ lại nó
     bằng tay: hộp tick do hệ điều hành vẽ, nên mọi cách khác đều phải
     `appearance: none` rồi tự dựng — và bản tự dựng thì mất luôn hành vi bàn
     phím lẫn trạng thái `:indeterminate`. Đây là cùng lý do icon chuyển sang
     SVG hôm qua, chỉ khác là ô tick còn cứu được bằng một dòng. */
  .bangDon td.oMa .tickGd {

  /* Mặt hàng ĐÃ tick: ô mã hơi đậm lên để lướt mắt thấy được phần đang ăn hệ

<script>
/* Đây là TOÀN BỘ những gì trang tĩnh này làm: hiển thị, và gọi Gateway kèm
 * Firebase ID token (LUẬT SỐ 1 — CLAUDE.md). Không một công thức tiền nào,
 * không một lượt đọc Realtime Database nào ở đây; nếu Ctrl+U đọc được cách
 * tính ra một con số tiền thì chỗ đó đặt sai.
 *
 * Cùng một Firebase project với Worker `tracking` (CLAUDE.md — dùng chung hạ
 * tầng). apiKey của Firebase không phải bí mật — nó định danh project, không
 * xác thực ai cả; thứ xác thực thật là mật khẩu người dùng gõ, và Google
 * kiểm nó, không phải trang này. */
const FB_CONFIG = {
  apiKey: "AIzaSyD2W_zJSmFXVgtlnr3aGAbYbO07bhpWXds",
  authDomain: "tinphattracking.firebaseapp.com",
  projectId: "tinphattracking",
  databaseURL: "https://tinphattracking-default-rtdb.asia-southeast1.firebasedatabase.app",
};
firebase.initializeApp(FB_CONFIG);

const $ = (id) => document.getElementById(id);
const manDangNhap = $('manDangNhap'), manChu = $('manChu');
const oEmail = $('oEmail'), oMatKhau = $('oMatKhau');
const loiDangNhap = $('loiDangNhap'), hopLoi = $('hopLoi');
const nutDangNhap = $('nutDangNhap');

/* Câu nói cho từng lý do Firebase từ chối. Chỉ những lý do THẬT SỰ là "sai
 * email/mật khẩu" mới được nói câu đó.
 *
 * Vì sao cần bảng này, giá đã trả 12/09/2026: lượt chuyển sang
 * `reports.tinphatcrm.com` (P7) không đăng nhập được, màn hình nói "kiểm tra
 * lại email/mật khẩu" — nên mật khẩu bị gõ lại nhiều lần trong khi lỗi thật
 * là một cái 403 của Google, không liên quan gì tới mật khẩu. Lý do thật chỉ
 * đọc được bằng cách mở DevTools. Một màn đăng nhập đổ lỗi cho người dùng về
 * một sự cố cấu hình là màn đăng nhập nói dối; đây đúng là bài học `S156` bên
 * V1 (`docs/audit/...` F-08: thao tác bắt buộc mà giao diện không nói ra).
 *
 * KHÔNG có bí mật nào trong mấy câu này: chúng là lỗi phía client của Google,
 * và `apiKey` Firebase vốn đã công khai trong `FB_CONFIG` ngay trên. */
const LOI_DANG_NHAP = {
  'auth/invalid-email': 'Email không đúng định dạng.',
  'auth/user-disabled': 'Tài khoản này đã bị khoá.',
  'auth/user-not-found': 'Sai email hoặc mật khẩu.',
  'auth/wrong-password': 'Sai email hoặc mật khẩu.',
  'auth/invalid-credential': 'Sai email hoặc mật khẩu.',
  'auth/invalid-login-credentials': 'Sai email hoặc mật khẩu.',
  'auth/too-many-requests': 'Google tạm khoá vì thử sai quá nhiều lần. Chờ ít phút rồi thử lại.',
  'auth/network-request-failed': 'Không nối được tới Google. Kiểm tra mạng rồi thử lại.',
  'auth/operation-not-allowed': 'Firebase chưa bật đăng nhập bằng email/mật khẩu cho project này.',
  'auth/invalid-api-key': 'Khoá API Firebase trong trang này không đúng — kiểm tra FB_CONFIG.',
  'auth/api-key-not-valid': 'Khoá API Firebase trong trang này không đúng — kiểm tra FB_CONFIG.',
  'auth/unauthorized-domain': 'Tên miền này chưa được phép đăng nhập. Firebase Console → '
    + 'Authentication → Settings → Authorized domains → thêm ' + location.hostname + '.',
};

/** Lý do Firebase từ chối, nói bằng tiếng người. Trả về `[câu, mã]`. */
function cauLoiDangNhap(e) {
  const ma = (e && e.code) || 'khong-ro';
  const tho = String((e && e.message) || '');

  /* Ca dễ mất nhiều giờ nhất: khoá API của Firebase bị giới hạn theo tên miền
     gọi (Google Cloud Console → APIs & Services → Credentials → khoá Browser →
     Website restrictions). Tên miền mới không nằm trong danh sách thì Google
     trả 403 ngay ở `identitytoolkit.googleapis.com`.

     Soi CẢ `code` LẪN `message`, vì SDK trả về hai dạng khác nhau tuỳ lúc và
     ta đã gặp cả hai: gặp thật 12/09/2026 trên `reports.tinphatcrm.com` thì
     `code` mang nguyên lý do
     (`auth/requests-from-referer-https://reports.tinphatcrm.com-are-blocked`),
     còn dạng kia gói thành `auth/internal-error` và nhét câu Google viết vào
     `message`. Bám một đầu là hở đầu kia — mà lúc hở thì màn hình lại quay về
     đổ lỗi mật khẩu, đúng thứ bộ kiểm này sinh ra để chặn. */
  if (/requests-from-referer|referer|referrer|API key|API_KEY|PERMISSION_DENIED|blocked/i.test(ma + ' ' + tho)) {
    return ['Google chặn lượt đăng nhập từ tên miền ' + location.hostname
      + '. Khoá API Firebase đang giới hạn theo tên miền: Google Cloud Console → '
      + 'APIs & Services → Credentials → khoá Browser của project tinphattracking → '
      + 'Website restrictions → thêm ' + location.hostname + '. '
      + '(Đây KHÔNG phải lỗi mật khẩu, và cũng khác mục Authorized domains bên Firebase.)', ma];
  }

  return [LOI_DANG_NHAP[ma] || 'Đăng nhập không thành công.', ma];
}

async function doDangNhap() {
  const email = oEmail.value.trim(), mk = oMatKhau.value;
  loiDangNhap.textContent = '';
  if (!email || !mk) { loiDangNhap.textContent = 'Nhập đủ email và mật khẩu.'; return; }
  nutDangNhap.disabled = true;
  try {
    await firebase.auth().signInWithEmailAndPassword(email, mk);
  } catch (e) {
    const [cau, ma] = cauLoiDangNhap(e);
    /* Kèm mã kỹ thuật ở cuối, luôn luôn: câu tiếng Việt để người dùng biết
       phải làm gì, mã để lần sau gặp một lý do chưa có trong bảng thì vẫn tra
       được ngay trên màn hình, không phải mở DevTools. */
    loiDangNhap.textContent = cau + ' [' + ma + ']';
  } finally {
    nutDangNhap.disabled = false;
  }
}
nutDangNhap.addEventListener('click', doDangNhap);
oMatKhau.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') doDangNhap(); });
$('nutDangXuat').addEventListener('click', () => firebase.auth().signOut());

/** Gọi Gateway — chỗ DUY NHẤT trang này nói chuyện với "phía sau", và luôn
 *  kèm Firebase ID token, không bao giờ tự khai uid/vai trong request. */
async function goiMe(user) {
  const token = await user.getIdToken();
  const r = await fetch('/api/me', { headers: { Authorization: 'Bearer ' + token } });
  const than = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(than.loi || ('HTTP ' + r.status));
  return than;
}

firebase.auth().onAuthStateChanged(async (user) => {
  if (!user) {
    manDangNhap.hidden = false; manChu.hidden = true;
    oMatKhau.value = '';
    return;
  }
  manDangNhap.hidden = true; manChu.hidden = false;
  hopLoi.textContent = '';
  $('tenNguoiDung').textContent = user.email;
  try {
    const me = await goiMe(user);
    $('tenNguoiDung').textContent = me.name || me.email;
    /* Vai để don-hang.js biết có khoá dải setup KPI lại hay không. Đây là
       phép kiểm TRANG TRÍ, không phải phân quyền: Gateway mới là chỗ chặn
       (`boc("quantri", …)`). Để ô gõ được mà lưu không được là lời hứa hỏng,
       nên khoá sẵn và nói lý do — nhưng sửa biến này trong Console cũng
       không mở được gì cả. */
    window.VAI_BAO_CAO = me.vai || null;
  } catch (e) {
    hopLoi.textContent = 'Không lấy được hồ sơ: ' + e.message
      + ' — liên hệ quản trị nếu tài khoản chưa được cấp quyền.';
  }
});
</script>
