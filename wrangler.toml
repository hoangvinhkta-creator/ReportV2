# Cloudflare Worker Gateway cho "Báo cáo Kinh doanh V2" (Tín Phát).
# Tên Worker: reportv2-gateway — xác nhận cùng chủ dự án trước khi deploy lần
# đầu (P1, ROADMAP.md).
#
# P7 (12/09/2026) — V2 nhận lại tên miền `reports.tinphatcrm.com` của V1, và
# Cloudflare Access bị BỎ: đăng nhập Firebase của chính app này là lớp duy
# nhất (chủ dự án chốt 12/09/2026, thu hẹp P7 còn đúng hai việc này). Trước
# đó Q6 của `docs/audit/...` để V2 ở `*.workers.dev` và hoãn route thật —
# phần hoãn đó nay hết hiệu lực, phần còn lại của Q6 không đổi.

name = "reportv2-gateway"
main = "src/index.js"
compatibility_date = "2026-09-11"

# ---- Tên miền thật (P7) ----
#
# Khai ROUTE, không khai `custom_domain = true`, và đây là lý do: host này
# đang có một bản ghi DNS proxied trỏ về Render (V1). Một route chạy TRƯỚC
# origin, nên lượt deploy này là chính lượt chuyển tên miền sang V2 — bản ghi
# cũ nằm lại nhưng không còn ai đi tới. `custom_domain = true` thì ngược lại:
# Cloudflare đòi chiếm luôn bản ghi DNS và TỪ CHỐI khi đang có bản ghi khác,
# tức phải xoá đường về V1 trước rồi mới deploy được — đổi một bước lùi được
# thành hai bước không lùi được.
#
# V1 KHÔNG còn lối vào nào khác sau lượt này: `render.yaml` của nó đặt
# `renderSubdomainPolicy: disabled`, nên địa chỉ `*.onrender.com` đã tắt và
# `reports.tinphatcrm.com` là cửa duy nhất của V1. Route này lấy đúng cửa đó.
# Đó cũng là lý do bỏ Access không mở V1 ra cho ai: V1 thành tối, không phải
# thành công khai. Điều kiện duy nhất phải giữ: đừng xoá route này khi Render
# của V1 còn sống — V1 không có đăng nhập nào cả (audit F-04).
[[routes]]
pattern = "reports.tinphatcrm.com/*"
zone_name = "tinphatcrm.com"

# Bật xem log (Cloudflare Dashboard → Observability). ĐỂ Ở ĐÂY, không bật
# bằng nút trên Dashboard: nút đó chỉ đổi cấu hình của MỘT lần build — build
# tự động kế tiếp (git integration, mỗi lần merge) nạp lại từ file này và
# tắt nó về mặc định, đúng như đã xảy ra thật 11/09/2026 lúc chủ dự án đang
# dò lỗi giữa chừng thì một PR khác merge, log bị tắt lại. Khai ở đây thì
# đi theo MỌI build — cùng lý do `[build] command` nằm ở đây, không nằm
# trên ô web (xem chú thích bên dưới).
[observability.logs]
enabled = true
invocation_logs = true

# ---- Lượt đẩy Google Sheet tự động (13/09/2026) ----
#
# Chủ dự án chốt 17h30 giờ VN mỗi ngày. Cron của Cloudflare chạy theo UTC và
# KHÔNG có ô khai múi giờ, nên 17:30 +07:00 phải quy đổi tay thành 10:30 UTC.
# Cùng ngày, không lùi ngày — 17h30 trừ 7 tiếng vẫn nằm trong ngày ấy.
#
# Đổi giờ thì sửa ĐÚNG ở đây và nhớ quy đổi lại; `kiem/day-sheet.js` canh con
# số này khớp với 17h30 để không ai sửa một nửa.
[triggers]
crons = ["30 10 * * *"]

# ---- Cửa chặn của bộ kiểm (CLAUDE.md: "Bộ kiểm hỏng là build hỏng") ----
#
# ĐỂ Ở ĐÂY chứ không để trong ô "Build command" trên dashboard Cloudflare, và
# đây là lý do — bài học đã trả giá bên Tracking (xem wrangler.toml repo đó):
# ô trên dashboard CHỈ áp cho nhánh production; build của nhánh phụ KHÔNG kế
# thừa nó, log ghi thẳng "Build command: None" rồi nhảy vào `wrangler deploy`.
# Khai ở đây thì lệnh nằm trong repo, đi theo MỌI build — production, nhánh
# phụ, hay chạy tay dưới máy — và sửa nó phải qua commit chứ không phải qua
# một ô nhập trên web mà không ai thấy khi nó đổi.
#
# `npm test` hỏng thì build dừng ngay tại đây, `wrangler deploy` không chạy,
# Cloudflare GIỮ NGUYÊN bản đang chạy. Đó là chỗ DUY NHẤT bộ kiểm thật sự
# chặn được một bản hỏng lên production — GitHub Actions chỉ báo, không chặn.
#
# Không có bước dựng ./dist như Tracking: Gateway phục vụ thẳng ./public.
[build]
command = "npm test"

# File tĩnh nằm trong ./public. run_worker_first = true: MỌI request chạy
# qua src/index.js trước, kể cả request vào file tĩnh — điều kiện để chặn
# đường nhạy cảm và gắn security header cho cả phần tĩnh (giống Worker
# `tracking` — xem wrangler.toml của repo đó).
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# ---- Kho ảnh hướng dẫn kích hoạt bảo hành (R2) — 19/09/2026 ----
#
# Mỗi hãng có tới ba mươi bước, mỗi bước một ảnh chụp màn hình cổng bảo
# hành. Chúng KHÔNG nằm trong Realtime Database: nhánh `bc/quyetdinh` được
# đọc TRỌN ở mọi lượt mở màn hình, nên vài MB base64 trong đó là cái giá
# trả ở mọi lượt bấm, không chỉ lượt xem hướng dẫn. R2 giữ byte, Firebase
# chỉ giữ cái khoá trỏ tới (chủ dự án chốt 19/09/2026, được hỏi giữa R2,
# base64 trong Firebase, và Firebase Storage).
#
# BUCKET PHẢI CÓ TRƯỚC LƯỢT DEPLOY ĐẦU: `wrangler deploy` từ chối một
# binding trỏ tới bucket không tồn tại, và vì `[build] command = "npm test"`
# nằm ngay dưới đây, lượt deploy hỏng sẽ GIỮ NGUYÊN bản đang chạy — không
# mất gì, nhưng cũng không lên được gì.
#
# Tên bucket là `reportv2` — chủ dự án tạo 19/09/2026 (tên đề xuất ban đầu
# `reportv2-huongdan` bị Cloudflare từ chối). TÊN Ở ĐÂY PHẢI KHỚP ĐÚNG tên
# trên Dashboard; lệch một ký tự thì mọi lượt deploy sau đó hỏng ở đúng
# dòng này, và triệu chứng là "merge xong mà bản chạy không đổi".
#
# Bucket dùng CHUNG cho cả app chứ không riêng ảnh hướng dẫn, nên mọi khoá
# ảnh đều mang tiền tố tên hãng (`Samsung/<mốc>.png` — xem `laKhoaAnh`
# trong src/index.js): thứ khác bỏ vào bucket này sau đó không đụng nhau.
#
# Ảnh không bao giờ đi thẳng từ R2 ra trình duyệt: bucket không mở public
# (Dashboard ghi "Public Access: Disabled"), mọi lượt xem đều qua
# `GET /api/bao-hanh/anh` và đòi đúng một token Firebase như mọi đường khác
# (xem `layAnhBaoHanh` trong src/index.js).
[[r2_buckets]]
binding = "ANH_BAO_HANH"
bucket_name = "reportv2"

# ---- Service Binding tới Report Engine ----
# Engine không route công khai, không workers.dev — chỉ Gateway gọi được nó,
# và chỉ qua đường này (kiem/engine-rieng-tu.js canh cả hai đầu).
[[services]]
binding = "REPORT_ENGINE"
service = "reportv2-engine"

[vars]
# Cùng một Firebase project với Tracking và Marketing (CLAUDE.md — dùng
# chung hạ tầng). Có giá trị mặc định trong src/auth.js và src/firebase.js;
# khai ở đây để đổi được mà không phải sửa code.
FB_PROJECT_ID = "tinphattracking"
FB_DB_URL = "https://tinphattracking-default-rtdb.asia-southeast1.firebasedatabase.app"

# Tên miền DUY NHẤT được phục vụ (P7). Là dữ liệu, không phải hằng số trong
# mã: đổi tên miền không được là một lần sửa code. Phải khớp đúng hostname
# của `[[routes]]` ở trên — `kiem/dinh-tuyen.js` canh đúng chỗ đó, vì hai
# nơi khai cùng một tên miền mà lệch nhau thì cờ dưới đây chuyển hướng người
# dùng sang một host Worker này không hề phục vụ.
CANONICAL_HOST = "reports.tinphatcrm.com"

# Cờ đóng địa chỉ `*.workers.dev`: "1" thì mọi host khác CANONICAL_HOST bị
# chỉ sang địa chỉ thật (GET/HEAD) hoặc bị 421 (method khác).
#
# ĐANG LÀ "0" CÓ CHỦ Ý, và đây là thứ tự bắt buộc: bật "1" trước khi route
# trên thật sự chiếm được host thì `*.workers.dev` chuyển hướng sang một tên
# miền còn đang trả về V1 — tự đẩy mình ra khỏi bản V2 vừa deploy, và không
# còn địa chỉ nào để vào mà sửa. Bật cờ là MỘT LƯỢT COMMIT RIÊNG, sau khi mở
# `reports.tinphatcrm.com` bằng máy thật và thấy V2.
ENFORCE_CANONICAL_HOST = "0"

# ---- Secret còn thiếu, phải đặt tay trước khi deploy thật ----
# FB_SA_EMAIL, FB_SA_KEY — tài khoản dịch vụ Firebase, dùng để đọc
# profiles/<uid> khi xác thực (src/auth.js gọi qua src/firebase.js). Đặt
# bằng: wrangler secret put FB_SA_EMAIL / FB_SA_KEY.
# Thiếu hai Secret này thì /api/me luôn trả 503 "thieu-service-account" —
# ĐÚNG hành vi mong muốn (fail closed), không phải lỗi.
