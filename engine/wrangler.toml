# Report Engine — Worker RIÊNG TƯ, không có đường vào từ Internet.
#
# Đây là nơi nghiệp vụ báo cáo (doanh thu, giá vốn, lợi nhuận...) sẽ sống từ
# P2 trở đi. Lý do tách hẳn thành một Worker thay vì thêm route vào Gateway:
# KHÔNG CÓ URL THÌ KHÔNG AI DÒ THẲNG VÀO ĐƯỢC, kể cả người đã có tài khoản
# nhân viên. Nó chỉ nhận lời gọi nội bộ từ Gateway qua Service Binding.
# Sao lại đúng mẫu đã chạy thật bên Tracking (price-engine/wrangler.toml).
#
# BA ĐIỀU KHÔNG ĐƯỢC THÊM VÀO FILE NÀY — cả ba đều mở đường công khai:
#   [[routes]]            gắn Worker vào một đường dẫn trên tên miền
#   [route]                như trên
#   workers_dev = true    cấp cho nó một địa chỉ <name>.<account>.workers.dev
#
# kiem/engine-rieng-tu.js canh đúng ba điều đó.

name = "reportv2-engine"
main = "src/index.js"
compatibility_date = "2026-09-11"

# Bật xem log — cùng lý do đặt ở đây như Gateway (xem wrangler.toml gốc
# repo: bật bằng nút trên Dashboard bị build tự động kế tiếp tắt lại).
[observability.logs]
enabled = true
invocation_logs = true

# Cấm dứt khoát địa chỉ workers.dev. Bỏ dòng này thì Cloudflare cấp địa chỉ
# công khai theo mặc định — Engine hết riêng tư mà không ai nhận ra.
workers_dev = false

# Cửa chặn của bộ kiểm, giống Gateway — Engine deploy độc lập nên phải có
# cửa riêng, không dựa vào build của Gateway.
#
# Thư mục này KHÔNG có package.json riêng, nhưng `npm test` vẫn chạy đúng:
# npm tự leo lên thư mục cha tìm package.json rồi chạy script với thư mục
# gốc repo làm nơi làm việc. Đã thử thật cả hai lối gọi và cả hai đều chạy
# được bộ kiểm:
#   · từ gốc repo:  wrangler deploy --config engine/wrangler.toml
#   · từ trong đây: cd engine && wrangler deploy
#
# NỐI GIT INTEGRATION CHO WORKER NÀY — cách sạch nhất:
#   Root directory:  engine
#   Build command:   (để trống)
#   Deploy command:  npx wrangler deploy          (mặc định)
#   Version command: npx wrangler versions upload (mặc định)
#
# Ô "Root directory" nằm trong khối *Build configuration* ở Settings →
# Builds của Worker — KHÔNG nằm ở wizard tạo Worker mới, nên dễ tưởng là
# không có. Đặt nó = `engine` thì Cloudflare đọc thẳng file này, cả ba
# lệnh mặc định đều trỏ đúng Worker, và hết cảnh báo "Update wrangler.toml
# ... name = 'reportv2-engine'".
#
# Lối thay thế nếu vì lý do nào đó phải để Root directory = `/`: đặt Deploy
# command `npx wrangler deploy --config engine/wrangler.toml` VÀ Version
# command `npx wrangler versions upload --config engine/wrangler.toml`.
# Thiếu `--config` ở Version command là nó deploy nhầm sang Gateway — đã
# gặp thật 11/09/2026. Đường dẫn bên trong file này (`main`) tính theo vị
# trí CHÍNH FILE NÀY, không theo nơi gọi lệnh — đã thử bằng --dry-run.
[build]
command = "npm test"

# KHÔNG có [assets]: Engine không phục vụ file nào, nó chỉ tính toán.
# KHÔNG có [vars]/Secret ở P1: chưa nghiệp vụ nào cần đọc gì. Từ P3 khi Engine
# cần dữ liệu Tracking (POST /api/min-ngay), khoá đi ở Secret riêng của chính
# Worker này — không dùng chung với Gateway (nguyên tắc quyền tối thiểu).
